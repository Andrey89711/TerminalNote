[package]
name = "terminalnote"
version = "0.1.1"
edition = "2021"
description = "Local Markdown and text notes in your terminal"
license = "MIT"
repository = "https://github.com/Andrey89711/TerminalNote"
readme = "README.md"
default-run = "note"

[[bin]]
name = "note"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
pulldown-cmark = "0.13"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "3"
toml = "0.8"
tui-textarea = "0.7"

[dev-dependencies]
portable-pty = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
