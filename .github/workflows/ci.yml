name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release tooling tests
        run: python -m unittest discover -s scripts -p "test_release*.py" -v
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Build static Windows release executable
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Verify Windows release runtime dependencies
        if: runner.os == 'Windows'
        run: python scripts/release.py check-windows target/x86_64-pc-windows-msvc/release/note.exe
      - name: Test isolated Windows setup with release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-setup.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/note.exe
      - name: Test isolated Windows uninstall with release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-uninstall.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/note.exe
