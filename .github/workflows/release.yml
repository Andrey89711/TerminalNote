name: Release

on:
  push:
    # GitHub tag filters are globs; validate enforces exact vX.Y.Z syntax.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require stable tag matching Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate-tag "$RELEASE_TAG"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    name: Package / ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: note.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: note
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release target (including static CRT on Windows)
        run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - name: Build release executable
        run: cargo build --locked --release --bin note --target ${{ matrix.target }}
      - name: Verify Windows x64 imports (no VC++ runtime DLLs)
        if: runner.os == 'Windows'
        run: python scripts/release.py check-windows target/${{ matrix.target }}/release/note.exe
      - name: Create and verify allowlisted archive
        run: python scripts/release.py package --platform ${{ matrix.platform }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create draft release (never publish)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify exact artifact set and combine SHA256 checksums
        run: python3 scripts/release.py checksums --directory dist
      - name: Create draft without modifying existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/terminalnote-*-windows-x86_64.zip \
            dist/terminalnote-*-linux-x86_64.tar.gz dist/SHA256SUMS.txt \
            --draft --verify-tag --title "TerminalNote $RELEASE_TAG" \
            --notes "Windows x64 and Linux x64 command-line binaries. Archives contain only the executable, README.md, LICENSE, and CHANGELOG.md. Verify SHA256SUMS.txt before extracting. Checksums are not digital signatures; binaries are not code-signed. Linux requires a compatible system C library. This release is a draft pending manual review."
